[pytest]
testpaths = master_management transaction_management
pythonpath = . shared_tools test_data master_management transaction_management
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --reruns 1 --reruns-delay 2 --html=reports/pytest-report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    positive: Positive clinical test cases
    negative: Negative validation and boundary test cases
    rbac: Role-based access control test cases
    smoke: Smoke test suite
    rac: Rasayu Ayurved Clinic master tests
    dwc: Doctor Wellness Clinic master tests
    baseline: Baseline visit transaction tests
    visit: Visit module tests
    on_exam: On Examination module tests
    master: Master management configuration tests
    create: Create operation tests
    read: Read operation tests
    update: Update operation tests
    delete: Delete operation tests
