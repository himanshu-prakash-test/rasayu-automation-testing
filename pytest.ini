[pytest]
testpaths = transaction-management master-management
pythonpath = . shared-tools transaction-management/update/baseline-module
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=pytest-report.html --self-contained-html
markers =
    positive: Positive clinical test cases
    negative: Negative validation and boundary test cases
    baseline: Baseline visit transaction tests
    smoke: Smoke test suite
